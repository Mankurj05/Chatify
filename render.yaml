services:
  - type: web
    name: chatify-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SESSION_COOKIE_SAME_SITE
        value: None
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false